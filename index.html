<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Otto AI Builder</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#0a0a0a; color:white; }
    header { background:#000; padding:18px; text-align:center; font-size:22px; font-weight:700; }
    .container { max-width:900px; margin:22px auto; padding:16px; }
    .card { background:#151515; padding:18px; border-radius:12px; margin-bottom:18px; }
    input[type="text"]{ width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#0b0b0b; color:white; }
    button{ margin-top:12px; padding:10px 14px; border-radius:8px; border:none; background:#000; color:white; cursor:pointer; }
    button:disabled{ opacity:.5; cursor:default; }
    #preview{ display:block; margin-top:16px; max-width:100%; border-radius:8px; }
    #loading{ margin-top:12px; color:#ddd; }
    small.mono{ display:block; margin-top:6px; color:#999; font-family:monospace; }
  </style>
</head>
<body>
  <header>Otto's AI Image Maker</header>
  <div class="container">
    <div class="card">
      <h3>Create an Image</h3>
      <input id="prompt" type="text" placeholder="e.g. minimal black-and-white robot logo" />
      <button id="genBtn">Generate Image</button>
      <div id="loading" style="display:none">Generating…</div>
      <img id="preview" src="" alt="" />
      <small class="mono" id="debug"></small>
    </div>
    <div class="card">
      <h3>Help Bring Video Generation</h3>
      <p>Video AI is expensive. Every purchase pushes us closer!</p>
      <div style="background:#222; height:14px; border-radius:8px; overflow:hidden;">
        <div id="progress" style="width:20%; height:100%; background:#000;"></div>
      </div>
    </div>
  </div>

<script>
(async ()=>{

const WORKER_BASE = "https://soft-frog-9903.theanimatored.workers.dev"; // e.g. https://yourname-xxx.workers.dev
const genBtn = document.getElementById("genBtn");
const preview = document.getElementById("preview");
const loading = document.getElementById("loading");
const promptInput = document.getElementById("prompt");
const debug = document.getElementById("debug");

function setLoading(on){
  loading.style.display = on ? "block" : "none";
  genBtn.disabled = on;
  genBtn.textContent = on ? "Generating..." : "Generate Image";
}

async function startPrediction(prompt){
  const res = await fetch(WORKER_BASE + "/start", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ prompt })
  });
  const j = await res.json();
  return j; // expected { id: "..." , raw: ... }
}

async function checkStatus(id){
  const res = await fetch(WORKER_BASE + "/status?id=" + encodeURIComponent(id));
  const j = await res.json();
  return j; // expected { status: "processing|succeeded|failed", output: [...] , raw: ... }
}

async function waitForImage(id, timeoutMs=120000, interval=1500){
  const start = Date.now();
  while (Date.now() - start < timeoutMs) {
    const j = await checkStatus(id);
    debug.textContent = "status: " + (j.status || "unknown");
    if (j.status === "succeeded" && j.output && j.output[0]) {
      return j.output[0]; // URL
    }
    if (j.status === "failed") throw new Error("Generation failed");
    await new Promise(r => setTimeout(r, interval));
  }
  throw new Error("Timed out waiting for image");
}

genBtn.addEventListener("click", async ()=>{
  const prompt = promptInput.value.trim();
  preview.src = "";
  debug.textContent = "";
  if (!prompt) { alert("Type a prompt first"); return; }
  try {
    setLoading(true);
    const start = await startPrediction(prompt);
    if (!start || !start.id) {
      console.error("Start returned:", start);
      throw new Error("Start failed");
    }
    debug.textContent = "prediction id: " + start.id;
    const imageUrl = await waitForImage(start.id);
    preview.src = imageUrl;
    debug.textContent = "Done — image URL:\n" + imageUrl;
  } catch (err) {
    console.error(err);
    alert("Error: " + err.message + ". Check console for details.");
  } finally {
    setLoading(false);
  }
});

})();
</script>
</body>
</html>
